# environment.yml
# ================
# Conda environment for the attention kernel benchmark.
# Targets GCE VMs (L4 for development, A100 for evaluation).
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune

name: attn_bench

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11          # best flash-attn wheel coverage
  - pip

  - pip:
    # ── PyTorch (CUDA 12.x build) ────────────────────────────────────────────
    # Both L4 and A100 ship with CUDA 12.x drivers on GCE standard images.
    # cuTile's CUDA 13.x toolkit is installed system-wide by setup_env.sh and
    # does not need to match the PyTorch CUDA runtime version.
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121
    - torchvision==0.20.1+cu121
    - torchaudio==2.5.1+cu121

    # ── cuTile ───────────────────────────────────────────────────────────────
    # Requires CUDA Toolkit 13.1+ installed system-wide (done by setup_env.sh).
    - cuda-tile              # stable API (cuda.tile)
    # - cuda-tile-experimental  # uncomment for autotune APIs

    # ── FlashAttention-2 ─────────────────────────────────────────────────────
    # Installed separately in setup_env.sh: wheel filename encodes the exact
    # (Python, PyTorch, CUDA) triple, so it must be resolved at install time.

    # ── utilities ────────────────────────────────────────────────────────────
    - ninja                  # parallel C++ builds (flash-attn fallback)
    - numpy